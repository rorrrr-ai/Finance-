<title>خريطة المال</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: sticky nav over a slow aurora; each institution family owns one vivid hue that recolours the page it leads. */
:root{
  color-scheme:dark;
  --bg:#070b1c; --bg2:#0b1128; --surface:#101836; --surface2:#17214a; --line:#263060; --line2:#34407a;
  --fg:#eef1ff; --mute:#a3add4; --dim:#7480ad;
  --emerald:#12e6a4; --gold:#ffc53d; --blue:#4d94ff; --magenta:#ff5cad; --coral:#ff8552; --cyan:#2ad8f5; --danger:#ff5468; --ok:#12e6a4;
  --on-acc:#060a18; --glow:.34;
  --acc:var(--emerald);
  --f-ar:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-en:"Inter","Segoe UI",system-ui,sans-serif;
  --f-d:"Space Grotesk","IBM Plex Sans Arabic","Segoe UI",sans-serif;
  --r:14px; --r2:22px;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#f3f5fd; --bg2:#e9edfb; --surface:#ffffff; --surface2:#f0f3ff; --line:#d5dbf2; --line2:#b9c2e6;
  --fg:#0a1030; --mute:#4a5584; --dim:#6b76a6;
  --emerald:#008f63; --gold:#a86a00; --blue:#1557e0; --magenta:#cf1273; --coral:#cf4410; --cyan:#00799a; --danger:#d21f3c; --ok:#008f63;
  --on-acc:#ffffff; --glow:.16;
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f5fd; --bg2:#e9edfb; --surface:#ffffff; --surface2:#f0f3ff; --line:#d5dbf2; --line2:#b9c2e6;
  --fg:#0a1030; --mute:#4a5584; --dim:#6b76a6;
  --emerald:#008f63; --gold:#a86a00; --blue:#1557e0; --magenta:#cf1273; --coral:#cf4410; --cyan:#00799a; --danger:#d21f3c; --ok:#008f63;
  --on-acc:#ffffff; --glow:.16;
}
[data-cat="dep"]{--acc:var(--blue)} [data-cat="mkt"]{--acc:var(--magenta)} [data-cat="con"]{--acc:var(--gold)}
[data-cat="inv"]{--acc:var(--emerald)} [data-cat="pub"]{--acc:var(--cyan)} [data-cat="fin"]{--acc:var(--coral)}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ar);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body[dir="ltr"]{font-family:var(--f-en);line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-d);line-height:1.25;margin:0;text-wrap:balance;font-weight:700}
body[dir="rtl"] h1,body[dir="rtl"] h2,body[dir="rtl"] h3,body[dir="rtl"] h4{font-family:var(--f-ar);line-height:1.45}
p{margin:0}
a{color:var(--acc)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.en{font-family:var(--f-d);font-weight:600;direction:ltr;unicode-bidi:isolate;letter-spacing:-.01em}
.tr{color:var(--mute);font-weight:400;unicode-bidi:isolate;direction:rtl}
.num{font-family:var(--f-d);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* aurora */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(90px);opacity:var(--glow);animation:drift 26s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--acc);top:-28vmax;inset-inline-start:-18vmax;transition:background 1s}
.aurora i:nth-child(2){background:var(--blue);bottom:-34vmax;inset-inline-end:-20vmax;animation-duration:34s;animation-delay:-8s}
.aurora i:nth-child(3){background:var(--magenta);top:30%;inset-inline-end:-36vmax;opacity:calc(var(--glow)*.7);animation-duration:40s;animation-delay:-16s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vmax,4vmax) scale(1.12)}100%{transform:translate(-4vmax,8vmax) scale(.94)}}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top-in{max-width:1220px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-d);font-weight:700;font-size:1.05rem;text-decoration:none;color:var(--fg);white-space:nowrap}
body[dir="rtl"] .brand{font-family:var(--f-ar)}
.brand b{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--emerald),var(--blue) 55%,var(--magenta));background-size:220% 220%;animation:hue 9s linear infinite alternate;color:#fff;font-family:var(--f-d);font-size:.95rem}
@keyframes hue{to{background-position:100% 100%}}
nav.main{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding-block:2px}
nav.main::-webkit-scrollbar{display:none}
nav.main a{flex:none;padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--mute);font-size:.9rem;font-weight:500;white-space:nowrap;border:1px solid transparent}
nav.main a:hover{color:var(--fg);background:var(--surface2)}
nav.main a.on{color:var(--on-acc);background:var(--acc);font-weight:600}
.tools{display:flex;gap:6px;flex:none}
.tool{height:36px;min-width:36px;padding:0 10px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;font-family:var(--f-d);font-weight:600;font-size:.85rem}
.tool:hover{border-color:var(--acc);color:var(--acc)}
@media (max-width:820px){.top-in{flex-wrap:wrap}.brand{flex:1}nav.main{order:3;flex-basis:100%}}

main{position:relative;z-index:1;max-width:1220px;margin:0 auto;padding-block:28px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:30px;min-height:70vh}
section{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:1.45rem}
.sec-h p{color:var(--mute);font-size:.95rem}
.lead{font-size:1.06rem;color:var(--mute);max-width:74ch}
.eyebrow{font-family:var(--f-d);font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:600}
body[dir="rtl"] .eyebrow{font-family:var(--f-ar);letter-spacing:0;font-size:.85rem}

/* hero */
.hero{display:grid;gap:22px;padding-block:14px 4px}
.hero h1{font-size:clamp(2rem,5.2vw,3.6rem);letter-spacing:-.02em;max-width:18ch}
.grad{background:linear-gradient(100deg,var(--emerald),var(--gold) 30%,var(--magenta) 62%,var(--blue));background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 8s ease-in-out infinite alternate}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);color:var(--fg);text-decoration:none;font-weight:600;cursor:pointer;font-size:.95rem}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.pri:hover{filter:brightness(1.08);color:var(--on-acc)}
.btn.sm{padding:7px 12px;font-size:.86rem;border-radius:10px}

/* ticker */
.ticker{direction:ltr;overflow:hidden;border-block:1px solid var(--line);background:color-mix(in srgb,var(--surface) 70%,transparent);border-radius:12px;border:1px solid var(--line)}
.ticker div{display:flex;gap:34px;width:max-content;padding:10px 0;animation:tick 60s linear infinite}
.ticker:hover div{animation-play-state:paused}
.ticker span{display:inline-flex;gap:8px;align-items:baseline;font-family:var(--f-d);font-size:.86rem;color:var(--mute);white-space:nowrap}
.ticker b{color:var(--fg);font-variant-numeric:tabular-nums}
.ticker em{font-style:normal;font-size:.78rem}
.up{color:var(--ok)} .down{color:var(--danger)}
@keyframes tick{to{transform:translateX(-50%)}}

/* cards & grids */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{font-size:1.08rem}
.card.soft{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.card.acc{border-color:color-mix(in srgb,var(--acc) 55%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 13%,var(--surface)),var(--surface) 60%)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--surface2);font-size:.88rem;color:var(--fg);text-decoration:none;cursor:pointer}
.chip.on,.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:600}
.chip.on .tr,.chip[aria-pressed="true"] .tr{color:inherit;opacity:.85}
button.chip:hover,a.chip:hover{border-color:var(--acc)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-family:var(--f-d);font-size:.74rem;font-weight:600;background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);direction:ltr}
ul.clean{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ul.clean li{padding-inline-start:18px;position:relative}
ul.clean li::before{content:"";position:absolute;inset-inline-start:0;top:.7em;width:8px;height:8px;border-radius:2px;background:var(--acc);transform:rotate(45deg)}

/* institution tiles */
.tile{position:relative;display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:var(--r2);background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--fg);transition:transform .18s,border-color .18s;min-width:0}
.tile:hover{transform:translateY(-3px);border-color:var(--acc)}
.mono{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;font-family:var(--f-d);font-weight:700;font-size:.9rem;background:color-mix(in srgb,var(--acc) 20%,transparent);color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 50%,transparent);direction:ltr}
.tile h3{font-size:1.02rem}
.tile small{color:var(--mute);font-size:.85rem;line-height:1.55}
.tile .en-name{font-family:var(--f-d);font-size:.8rem;color:var(--acc);direction:ltr;text-align:start}

/* flow map */
.flow{display:grid;gap:12px}
.flow-band{border:1px dashed var(--line2);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flow-band>span{font-weight:600;font-size:.9rem}
.flow-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,2.4fr) auto minmax(0,1fr);gap:10px;align-items:stretch}
.flow-side{border-radius:var(--r2);padding:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;justify-content:center}
.flow-side h3{font-size:1rem}
.flow-side small{color:var(--mute);font-size:.84rem}
.flow-mid{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.flow-grp{border-radius:var(--r);padding:12px;background:color-mix(in srgb,var(--acc) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--acc) 40%,var(--line));display:flex;flex-direction:column;gap:8px;min-width:0}
.flow-grp h4{font-size:.86rem;color:var(--acc)}
.flow-arrow{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;color:var(--mute);font-size:.74rem;text-align:center;min-width:54px}
.flow-arrow b{font-size:1.5rem;line-height:1;color:var(--acc)}
@media (max-width:860px){.flow-row{grid-template-columns:1fr}.flow-arrow{flex-direction:row}.flow-arrow b{transform:rotate(90deg)}body[dir="rtl"] .flow-arrow b{transform:rotate(-90deg)}.flow-mid{grid-template-columns:1fr}}

/* bars */
.rows{display:flex;flex-direction:column;gap:9px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:4px 10px;align-items:center;font-size:.9rem}
.row .lab{min-width:0}
.row .val{font-family:var(--f-d);font-variant-numeric:tabular-nums;text-align:end;color:var(--mute);direction:ltr}
.row .track{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.row .fill{display:block;height:100%;border-radius:99px;background:var(--acc)}
.row.eq .fill{background:var(--gold)}
.strip{display:flex;height:16px;border-radius:99px;overflow:hidden;gap:2px;direction:ltr}
.strip i{display:block;background:var(--acc)}
.strip i.eq{background:var(--gold)}
.bs-eq{font-family:var(--f-d);text-align:center;padding:10px;border-radius:12px;background:var(--surface2);font-weight:600}

/* tables */
.scroll{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.82rem;color:var(--mute);font-weight:600;background:var(--surface2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:end;font-family:var(--f-d);font-variant-numeric:tabular-nums;direction:ltr;white-space:nowrap}
tr.sub td{font-weight:600;background:color-mix(in srgb,var(--acc) 8%,transparent)}
tr.tot td{font-weight:700;background:color-mix(in srgb,var(--acc) 16%,transparent)}
td small{display:block;color:var(--mute);font-size:.82rem;line-height:1.5}
.pos{color:var(--ok)} .neg{color:var(--danger)}

/* kpi */
.kpi{padding:14px;border-radius:var(--r);background:var(--surface2);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi b{font-family:var(--f-d);font-size:1.12rem;color:var(--acc);direction:ltr;text-align:start}
.kpi span{font-size:.86rem}
.kpi small{color:var(--mute);font-size:.84rem;line-height:1.55}
.stat{padding:14px;border-radius:var(--r);background:var(--surface2);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--f-d);font-size:1.35rem;font-variant-numeric:tabular-nums;direction:ltr;text-align:start;color:var(--acc)}
.stat span{font-size:.82rem;color:var(--mute);font-family:var(--f-d);direction:ltr;display:block;text-align:start}

/* risk */
.lv{display:inline-grid;place-items:center;min-width:54px;padding:3px 8px;border-radius:8px;font-size:.78rem;font-weight:600}
.lv0{background:var(--surface2);color:var(--dim)}
.lv1{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.lv2{background:color-mix(in srgb,var(--gold) 24%,transparent);color:var(--gold)}
.lv3{background:color-mix(in srgb,var(--danger) 26%,transparent);color:var(--danger)}
.killer{border-inline-start:4px solid var(--danger);padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--danger) 10%,var(--surface))}

/* ladder */
.ladder{display:flex;flex-direction:column-reverse;gap:6px}
.ladder div{padding:9px 14px;border-radius:10px;background:color-mix(in srgb,var(--acc) calc(8% + var(--i)*7%),var(--surface2));border:1px solid var(--line);font-size:.9rem;margin-inline-start:calc(var(--i)*14px)}
.steps{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));counter-reset:s}
.step{counter-increment:s;padding:14px;border-radius:var(--r);background:var(--surface2);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.step::before{content:counter(s);font-family:var(--f-d);font-weight:700;color:var(--acc);font-size:1.3rem}
.step small{color:var(--mute);font-size:.86rem}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:var(--r);background:var(--surface2);border:1px solid var(--line)}
.quiz p.q{font-weight:600}
.opts{display:grid;gap:8px}
.opt{text-align:start;padding:10px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--surface))}
.opt.no{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 16%,var(--surface))}
.why{font-size:.9rem;color:var(--mute);padding:10px 12px;border-radius:10px;background:var(--surface)}

/* calculators */
.calc{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
@media (max-width:800px){.calc{grid-template-columns:1fr}}
.fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));align-content:start}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--mute);min-width:0}
.fld input,.fld select,.inp{padding:9px 11px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);font-family:var(--f-d);font-variant-numeric:tabular-nums;direction:ltr;width:100%;min-width:0}
.fld input:focus,.inp:focus{border-color:var(--acc);outline:none}
.out{display:flex;flex-direction:column;gap:10px;min-width:0}
.big{padding:16px;border-radius:var(--r);background:linear-gradient(140deg,color-mix(in srgb,var(--acc) 24%,var(--surface)),var(--surface2));border:1px solid color-mix(in srgb,var(--acc) 50%,var(--line))}
.big b{display:block;font-family:var(--f-d);font-size:1.9rem;font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
.big span{font-size:.86rem;color:var(--mute)}
.formula{font-family:var(--f-d);direction:ltr;text-align:left;padding:10px 12px;border-radius:10px;background:var(--surface2);font-size:.86rem;overflow-x:auto;white-space:nowrap}
.heat td{text-align:center;font-family:var(--f-d);font-variant-numeric:tabular-nums;direction:ltr}
.heat td.mid{outline:2px solid var(--acc);outline-offset:-2px;font-weight:700}

details.qa{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
details.qa summary{cursor:pointer;padding:14px 16px;font-weight:600;list-style:none;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
details.qa summary::-webkit-details-marker{display:none}
details.qa[open] summary{border-bottom:1px solid var(--line);color:var(--acc)}
details.qa>div{padding:14px 16px;color:var(--mute)}

/* flashcard */
.flash{min-height:230px;border-radius:var(--r2);padding:26px;display:flex;flex-direction:column;gap:12px;justify-content:center;align-items:center;text-align:center;cursor:pointer;background:linear-gradient(150deg,color-mix(in srgb,var(--acc) 22%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--acc) 50%,var(--line));width:100%}
.flash .en{font-size:1.7rem}
.flash p{max-width:52ch}
.prog{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--emerald),var(--gold),var(--magenta));border-radius:99px}

.lad{display:flex;flex-direction:column;gap:8px}
.lad>div{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--acc) calc(5% + var(--i)*4%),var(--surface2));border:1px solid var(--line)}
.lad .n{font-family:var(--f-d);font-weight:700;color:var(--acc);font-size:1.05rem}
.lad b{font-weight:600;min-width:0}
.lad small{grid-column:2/-1;color:var(--mute);font-size:.86rem;line-height:1.55}
tr.hd td{font-family:var(--f-d);font-size:.78rem;letter-spacing:.06em;color:var(--acc);background:var(--surface2);font-weight:600}
.tl{display:flex;flex-direction:column;gap:12px}
.tl>div{display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;align-items:start}
.tl .yr{font-family:var(--f-d);font-weight:700;font-size:1.15rem;color:var(--acc);direction:ltr;text-align:start;padding-top:14px}
@media (max-width:600px){.tl>div{grid-template-columns:1fr;gap:4px}.tl .yr{padding-top:0}}
